<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Backstage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1d24; --panel:#0f262e; --panel2:#13303a; --ink:#f4ebee; --muted:#98aeae; --accent:#f39bbd;
    --line:rgba(244,235,238,.12); --danger:#ff8a8a; --ok:#8fd6a4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-weight:300;min-height:100vh}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* top bar */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
       padding:16px clamp(16px,3vw,32px);background:rgba(10,29,36,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-family:"Cormorant Garamond",serif;font-size:24px;font-style:italic}
  .brand small{font-family:Manrope,sans-serif;font-style:normal;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-left:6px}
  .top .right{display:flex;align-items:center;gap:14px}
  .status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:120px;justify-content:flex-end}
  .status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .status.saving i{background:var(--accent);animation:pulse 1s infinite}
  .status.error{color:var(--danger)} .status.error i{background:var(--danger)}
  @keyframes pulse{50%{opacity:.3}}
  .btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
       background:transparent;font-size:13px;letter-spacing:.04em;text-decoration:none;color:var(--ink);transition:border-color .2s,background .2s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
  .btn.primary:hover{background:var(--accent);border-color:var(--accent)}
  .btn.danger{color:var(--danger)} .btn.danger:hover{border-color:var(--danger)}

  .banner{display:none;margin:16px clamp(16px,3vw,32px) 0;padding:14px 18px;border-radius:10px;background:#3a1f26;color:#ffd5dc;font-size:14px;line-height:1.6}
  .banner.show{display:block}
  .banner code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px}

  /* layout */
  .wrap{display:flex;flex-wrap:wrap;gap:24px;padding:24px clamp(16px,3vw,32px) 80px;align-items:flex-start}
  .side{flex:1 1 260px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .main{flex:999 1 560px;min-width:0}
  .side h2{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:4px 4px 12px}
  .plist{list-style:none;display:flex;flex-direction:column;gap:6px}
  .pitem{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:background .2s}
  .pitem:hover{background:var(--panel2)}
  .pitem.on{background:var(--panel2);border-color:var(--line)}
  .pitem .thumb{width:48px;height:48px;border-radius:8px;background:#163942 center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted)}
  .pitem .meta{min-width:0;flex:1}
  .pitem .t{font-family:"Cormorant Garamond",serif;font-size:19px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pitem .s{font-size:12px;color:var(--muted)}
  .pitem .order{display:flex;flex-direction:column}
  .icon{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:none;background:transparent;color:var(--muted)}
  .icon:hover{background:rgba(255,255,255,.06);color:var(--ink)}
  .icon:disabled{opacity:.25;pointer-events:none}
  .icon svg{width:16px;height:16px}
  .side .btn{width:100%;justify-content:center;margin-top:12px}

  /* editor */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px);margin-bottom:24px}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  .field{display:flex;flex-direction:column;gap:8px}
  .field.wide{grid-column:1/-1}
  label,.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
  input[type=text],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;min-height:46px;transition:border-color .2s}
  input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none}
  input.title{font-family:"Cormorant Garamond",serif;font-size:28px;font-style:italic;padding:8px 14px}
  textarea{min-height:120px;resize:vertical;line-height:1.6}
  .cats{display:flex;flex-wrap:wrap;gap:10px}
  .cat{position:relative}
  .cat input{position:absolute;opacity:0;width:1px;height:1px}
  .cat span{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;cursor:pointer;transition:all .2s;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400}
  .cat input:checked + span{background:var(--accent);border-color:var(--accent);color:#2a0f1b}
  .cat input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

  .tagbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:50px}
  .tagbox:focus-within{border-color:var(--accent)}
  .tagbox input{flex:1;min-width:160px;border:none !important;background:transparent;padding:6px !important;min-height:34px !important}
  .tchip{min-height:34px;padding:0 12px;border-radius:999px;border:none;background:var(--accent);color:#2a0f1b;font-size:13px;font-weight:500}
  .tchip:hover{background:#fff}
  .sugg{display:flex;flex-wrap:wrap;gap:6px}
  .tsug{min-height:32px;padding:0 12px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:12px}
  .tsug:hover{border-color:var(--accent);color:var(--ink)}
  @media (max-width:640px){
    .top{padding:12px 16px}.brand small{display:none}.status{min-width:0}.status span{font-size:12px}
    .wrap{padding:16px 12px 60px;gap:16px}
    .side{max-width:none}
    .imgs{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
    .card{padding:16px}
    .drop{padding:24px 12px}
  }
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .head p{font-size:13px;color:var(--muted)}

  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:36px 16px;
        border:1.5px dashed rgba(243,155,189,.45);border-radius:14px;background:rgba(243,155,189,.04);cursor:pointer;transition:all .2s}
  .drop:hover,.drop.over{background:rgba(243,155,189,.1);border-color:var(--accent)}
  .drop svg{width:44px;height:44px;color:var(--accent)}
  .drop b{font-weight:500;font-size:16px}
  .drop span{font-size:13px;color:var(--muted)}

  .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:18px}
  .tile{position:relative;border-radius:10px;overflow:hidden;background:#163942;aspect-ratio:1;border:1px solid var(--line);cursor:grab}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile.dragging{opacity:.35}
  .tile.target{outline:2px solid var(--accent);outline-offset:2px}
  .tile .badge{position:absolute;left:8px;top:8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:var(--accent);color:#2a0f1b;padding:4px 8px;border-radius:999px;font-weight:600}
  .tile .tools{position:absolute;right:6px;top:6px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
  .tile:hover .tools,.tile:focus-within .tools{opacity:1}
  .tile .tools button{width:32px;height:32px;border-radius:50%;border:none;background:rgba(10,29,36,.85);color:var(--ink);display:grid;place-items:center}
  .tile .tools button:hover{background:var(--accent);color:#2a0f1b}
  .tile .tools svg{width:14px;height:14px}
  .tile.uploading::after{content:"Uploading…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,29,36,.65);font-size:13px}
  .tile.failed::after{content:attr(data-error);position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;background:rgba(58,31,38,.9);color:#ffd5dc;font-size:12px}
  @media (hover:none){ .tile .tools{opacity:1} }

  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .danger-zone{display:flex;justify-content:flex-end}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .login{max-width:420px;margin:12vh auto;padding:36px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center}
  .login h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-style:italic;font-size:40px;margin-bottom:6px}
  .login p{color:var(--muted);font-size:14px;margin-bottom:24px}
  .login form{display:flex;flex-direction:column;gap:12px;text-align:left}
  .login input{width:100%}
  .login .btn{justify-content:center}
  .login .err{color:var(--danger);font-size:13px;min-height:18px;text-align:center}
  body.needs-login .wrap, body.needs-login .top .right{display:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true"><g fill="currentColor"><path d="M16 6c3 4 3 10 0 16-3-6-3-12 0-16Z"/><path d="M6 13c5 0 8.5 4 10 9-5 0-8.5-3.5-10-9Z" opacity=".7"/><path d="M26 13c-5 0-8.5 4-10 9 5 0 8.5-3.5 10-9Z" opacity=".7"/></g></svg>
    Backstage <small>Portfolio editor</small>
  </div>
  <div class="right">
    <div class="status" id="status" role="status" aria-live="polite"><i></i><span>All changes saved</span></div>
    <a class="btn" href="/" target="_blank" rel="noopener">View site ↗</a>
    <button class="btn" id="logout" type="button" hidden>Log out</button>
  </div>
</div>

<div class="banner" id="banner">
  Backstage can't reach its server, so nothing can be saved. Open Terminal in the portfolio folder and run
  <code>python3 server.py</code>, then open <code>http://localhost:8765/admin</code>.
</div>

<section class="login" id="login" hidden aria-labelledby="loginTitle">
  <h1 id="loginTitle">Backstage</h1>
  <p id="loginNote">Enter your password to edit the portfolio.</p>
  <form id="loginForm">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Log in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<div class="wrap">
  <aside class="side" aria-label="Projects">
    <h2>Projects</h2>
    <ul class="plist" id="plist"></ul>
    <button class="btn" id="addProject" type="button">+ New project</button>
  </aside>

  <main class="main" id="editor"></main>
</div>

<input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/avif,image/gif" multiple class="sr" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast"></div>

<script>
const GROUPS = ["Food related", "Others"];   // the side menu on the site
const TAG_SUGGESTIONS = ["Branding", "UI design", "Graphic design", "Packaging", "Illustration", "Campaign", "Social media", "Typography", "Web design", "Mascot"];
// Older saves used "cats"; turn them into tags and give every project a group.
const normalize = p => { const q = { ...p, group: p.group || "Food related", tags: Array.isArray(p.tags) ? p.tags : (p.cats || []) }; delete q.cats; return q; };
const ICON = {
  up:   '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>',
  down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>',
  x:    '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  star: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 2l1.8 3.7 4 .6-2.9 2.8.7 4L8 11.2 4.4 13.1l.7-4L2.2 6.3l4-.6z"/></svg>',
  img:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 11l3.5-3 3 2.5 2-1.5L14 11"/></svg>',
  upload:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 31V11M16 18l8-8 8 8"/><path d="M8 30v6a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4v-6"/></svg>'
};

let data = { projects: [] }, sel = 0, serverOK = true;
let mode = 'local', uploadMode = 'token', blobClient = null;   // 'local' = server.py on this computer, 'online' = Vercel
const view = src => /^https?:\/\//.test(src) ? src : '/' + src;
const BLOB_CLIENT = 'https://cdn.jsdelivr.net/npm/@vercel/blob@2.9.0/client/+esm';
const $ = s => document.querySelector(s);
const el = (tag, props={}, kids=[]) => { const n = Object.assign(document.createElement(tag), props); kids.forEach(k => n.append(k)); return n; };
const slug = s => (s||'project').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'project';

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove('show'), 2600); }
function setStatus(kind, text){ const s = $('#status'); s.className = 'status ' + kind; s.querySelector('span').textContent = text; }

/* ---------- loading & saving ---------- */
async function detectMode(){
  try {
    const r = await fetch('/api/session', {cache:'no-store'});
    const s = r.ok && (r.headers.get('content-type')||'').includes('json') ? await r.json() : null;
    if (s && s.online){ mode = 'online'; uploadMode = s.uploadMode; return s; }
  } catch(e){}
  return null;
}
async function load(){
  const session = await detectMode();
  if (mode === 'online' && !session.authed){ showLogin(session.configured ? '' : 'Backstage needs a password: add ADMIN_PASSWORD in the Vercel project settings, then redeploy.'); return; }
  document.body.classList.remove('needs-login'); $('#login').hidden = true;
  $('#logout').hidden = mode !== 'online';
  let loaded = null;
  if (mode === 'online'){ try { const r = await fetch('/api/projects?t=' + Date.now(), {cache:'no-store'}); if (r.ok) loaded = await r.json(); } catch(e){} }
  if (!loaded){ try { const r = await fetch('/projects.json', {cache:'no-store'}); if (r.ok) loaded = await r.json(); } catch(e){} }
  data = loaded && Array.isArray(loaded.projects) ? { ...loaded, projects: loaded.projects.map(normalize) } : { projects: [] };
  renderList(); renderEditor();
  if (mode === 'local'){
    try { const r = await fetch('/api/ping', {method:'POST'}); serverOK = r.status !== 501 && r.status !== 405; }
    catch(e){ serverOK = false; }
    $('#banner').classList.toggle('show', !serverOK);
  }
}
function showLogin(note){
  document.body.classList.add('needs-login'); $('#login').hidden = false;
  if (note) $('#loginNote').textContent = note;
  setTimeout(()=>$('#pw').focus(), 50);
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); $('#loginErr').textContent = '';
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: $('#pw').value})});
  const res = await r.json().catch(()=>({}));
  if (!r.ok){ $('#loginErr').textContent = res.error || 'Could not log in'; return; }
  $('#pw').value = '';
  if (data.projects.length){ document.body.classList.remove('needs-login'); $('#login').hidden = true; $('#logout').hidden = false; save(); }
  else load();
};
$('#logout').onclick = async () => {
  await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({logout:true})});
  location.reload();
};

let saveTimer = null, saving = Promise.resolve();
function scheduleSave(){ setStatus('saving','Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(save, 500); }
function save(){
  saving = saving.then(async ()=>{
    try {
      const r = await fetch('/api/projects', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
      if (r.status === 401 && mode === 'online'){ showLogin('Your session ended — log in again; your changes are kept on this page.'); throw new Error('please log in again'); }
      if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.statusText);
      setStatus('', 'All changes saved');
      return true;
    } catch(e){ setStatus('error', 'Not saved — ' + e.message); if (mode === 'local') $('#banner').classList.add('show'); return false; }
  });
  return saving;
}
async function deleteFile(src){
  try {
    if (mode === 'online'){ if (/^https?:/.test(src)) await fetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url: src})}); }
    else await fetch('/api/upload?src=' + encodeURIComponent(src), {method:'DELETE'});
  } catch(e){}
}
window.addEventListener('beforeunload', e => { if ($('#status').classList.contains('saving')) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- project list ---------- */
function renderList(){
  const ul = $('#plist'); ul.textContent = '';
  data.projects.forEach((p, i) => {
    const thumb = el('div', {className:'thumb'});
    if (p.images && p.images[0]) thumb.style.backgroundImage = `url("${view(p.images[0])}")`; else thumb.innerHTML = ICON.img;
    const meta = el('div', {className:'meta'}, [
      el('div', {className:'t', textContent: p.title || 'Untitled'}),
      el('div', {className:'s', textContent: [p.group, p.year, (p.images||[]).length + ' img'].filter(Boolean).join(' · ')})
    ]);
    const up = el('button', {className:'icon', type:'button', innerHTML:ICON.up, disabled:i===0, title:'Move up'}); up.setAttribute('aria-label','Move ' + (p.title||'project') + ' up');
    const dn = el('button', {className:'icon', type:'button', innerHTML:ICON.down, disabled:i===data.projects.length-1, title:'Move down'}); dn.setAttribute('aria-label','Move ' + (p.title||'project') + ' down');
    up.onclick = e => { e.stopPropagation(); move(i, -1); };
    dn.onclick = e => { e.stopPropagation(); move(i, 1); };
    const li = el('li', {className:'pitem' + (i===sel?' on':''), tabIndex:0}, [thumb, meta, el('div',{className:'order'},[up,dn])]);
    li.setAttribute('aria-current', i===sel ? 'true' : 'false');
    li.onclick = () => { sel = i; renderList(); renderEditor(); };
    li.onkeydown = e => { if (e.key==='Enter' || e.key===' ') { e.preventDefault(); li.click(); } };
    ul.append(li);
  });
}
function move(i, d){
  const j = i + d; if (j < 0 || j >= data.projects.length) return;
  [data.projects[i], data.projects[j]] = [data.projects[j], data.projects[i]];
  if (sel === i) sel = j; else if (sel === j) sel = i;
  renderList(); scheduleSave();
}
$('#addProject').onclick = () => {
  data.projects.unshift({ id: 'project-' + Date.now().toString(36), title:'', subtitle:'', year: String(new Date().getFullYear()), group: GROUPS[0], tags:[], desc:'', images:[] });
  sel = 0; renderList(); renderEditor(); scheduleSave();
  setTimeout(()=>$('#f-title') && $('#f-title').focus(), 50);
};

/* ---------- editor ---------- */
function renderEditor(){
  const ed = $('#editor'); ed.textContent = '';
  const p = data.projects[sel];
  if (!p){ ed.append(el('div',{className:'card empty', textContent:'No projects yet — add one on the left.'})); return; }

  const field = (id, labelText, input, wide) => { const f = el('div',{className:'field'+(wide?' wide':'')}); const l = el('label',{htmlFor:id, textContent:labelText}); f.append(l, input); return f; };
  const text = (id, key, placeholder, cls) => {
    const i = el('input', {type:'text', id, value: p[key] || '', placeholder, className: cls||''});
    i.oninput = () => { p[key] = i.value; if (key==='title') p.id = p.id || slug(i.value); renderList(); scheduleSave(); };
    return i;
  };
  const desc = el('textarea', {id:'f-desc', value: p.desc || '', placeholder:'What was the brief, what did you make, what are you proud of?'});
  desc.oninput = () => { p.desc = desc.value; scheduleSave(); };

  // group: one of the side-menu sections
  const groups = el('div', {className:'cats', role:'radiogroup'}); groups.setAttribute('aria-labelledby','grp-lbl');
  GROUPS.forEach(g => {
    const rb = el('input', {type:'radio', name:'grp', checked: p.group === g});
    rb.onchange = () => { if (rb.checked){ p.group = g; scheduleSave(); } };
    groups.append(el('label', {className:'cat'}, [rb, el('span',{textContent:g})]));
  });
  const groupField = el('div',{className:'field wide'},[el('div',{className:'lbl', id:'grp-lbl', textContent:'Show under'}), groups]);

  // tags: free text chips, with quick suggestions
  p.tags = p.tags || [];
  const tagWrap = el('div',{className:'tagbox'});
  const tagInput = el('input',{type:'text', id:'f-tags', placeholder:'Type a tag and press Enter'});
  const sugg = el('div',{className:'sugg'});
  function drawTags(){
    tagWrap.textContent = '';
    p.tags.forEach((t, i) => {
      const x = el('button',{type:'button', className:'tchip', textContent: t + '  ✕'}); x.setAttribute('aria-label','Remove tag ' + t);
      x.onclick = () => { p.tags.splice(i,1); drawTags(); scheduleSave(); };
      tagWrap.append(x);
    });
    tagWrap.append(tagInput);
    sugg.textContent = '';
    TAG_SUGGESTIONS.filter(t => !p.tags.some(x => x.toLowerCase() === t.toLowerCase())).forEach(t => {
      const b = el('button',{type:'button', className:'tsug', textContent:'+ ' + t}); b.onclick = () => addTag(t); sugg.append(b);
    });
  }
  function addTag(t){ t = t.trim().replace(/\s+/g,' ').slice(0,30); if (!t || p.tags.some(x => x.toLowerCase() === t.toLowerCase())) return;
    p.tags.push(t); drawTags(); scheduleSave(); tagInput.focus(); }
  tagInput.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ','){ e.preventDefault(); addTag(tagInput.value); tagInput.value = ''; }
    if (e.key === 'Backspace' && !tagInput.value && p.tags.length){ p.tags.pop(); drawTags(); scheduleSave(); }
  };
  tagInput.onblur = () => { if (tagInput.value.trim()){ addTag(tagInput.value); tagInput.value = ''; } };
  drawTags();
  const tagLbl = el('label',{htmlFor:'f-tags', textContent:'Tags'});
  const catField = el('div',{className:'field wide'},[tagLbl, tagWrap, sugg]);

  ed.append(el('div',{className:'card'},[
    el('div',{className:'fields'},[
      field('f-title','Project title', text('f-title','title','e.g. FYFTH','title'), true),
      field('f-sub','Short line', text('f-sub','subtitle','e.g. Coconut gelato')),
      field('f-year','Year', text('f-year','year','e.g. 2025 or 2023–2024')),
      groupField,
      catField,
      field('f-desc','Description', desc, true)
    ])
  ]));

  /* images */
  const drop = el('div',{className:'drop', tabIndex:0, role:'button'});
  drop.setAttribute('aria-label','Add images: drop files here or press Enter to choose');
  drop.innerHTML = ICON.upload + '<b>Drop images here</b><span>or click to choose · JPG, PNG, WebP, AVIF, GIF · up to 40 MB each</span>';
  drop.onclick = () => $('#fileInput').click();
  drop.onkeydown = e => { if (e.key==='Enter' || e.key===' ') { e.preventDefault(); drop.click(); } };

  const grid = el('div',{className:'imgs', id:'imgs'});
  (p.images||[]).forEach((src, i) => grid.append(tile(p, src, i)));

  const card = el('div',{className:'card'},[
    el('div',{className:'head'},[el('div',{className:'lbl', textContent:'Images'}), el('p',{textContent:'Drag to reorder · the first image is the cover'})]),
    drop, grid
  ]);
  ed.append(card);

  // whole images card accepts file drops
  ['dragenter','dragover'].forEach(ev => card.addEventListener(ev, e => { if (hasFiles(e)) { e.preventDefault(); drop.classList.add('over'); } }));
  ['dragleave','drop'].forEach(ev => card.addEventListener(ev, e => { if (ev==='dragleave' && card.contains(e.relatedTarget)) return; drop.classList.remove('over'); }));
  card.addEventListener('drop', e => { if (hasFiles(e)) { e.preventDefault(); upload(p, [...e.dataTransfer.files]); } });

  const del = el('button',{className:'btn danger', type:'button', textContent:'Delete project'});
  del.onclick = async () => {
    const n = (p.images||[]).length;
    if (!confirm(`Delete “${p.title || 'Untitled'}”` + (n ? ` and its ${n} image${n===1?'':'s'}? The image files will be removed from the works folder.` : '?'))) return;
    const files = [...(p.images||[])];
    data.projects.splice(sel, 1); sel = Math.max(0, sel-1);
    renderList(); renderEditor();
    clearTimeout(saveTimer); setStatus('saving','Saving…');
    if (await save()) { files.forEach(deleteFile); toast('Project deleted'); }
  };
  ed.append(el('div',{className:'danger-zone'},[del]));
}
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');

let dragFrom = null;
function tile(p, src, i){
  const t = el('div',{className:'tile', draggable:true, tabIndex:0});
  t.setAttribute('aria-label', `Image ${i+1}` + (i===0 ? ' (cover)' : ''));
  t.append(el('img',{src:view(src), alt:'', loading:'lazy'}));
  if (i===0) t.append(el('div',{className:'badge', textContent:'Cover'}));
  const tools = el('div',{className:'tools'});
  if (i>0){ const c = el('button',{type:'button', innerHTML:ICON.star, title:'Make cover'}); c.setAttribute('aria-label','Make this the cover');
    c.onclick = () => { p.images.splice(i,1); p.images.unshift(src); renderEditor(); renderList(); scheduleSave(); }; tools.append(c); }
  const x = el('button',{type:'button', innerHTML:ICON.x, title:'Remove image'}); x.setAttribute('aria-label','Remove this image');
  x.onclick = async () => {
    if (!confirm('Remove this image from the project? Uploaded files are deleted too.')) return;
    p.images.splice(i,1); renderEditor(); renderList();
    clearTimeout(saveTimer); setStatus('saving','Saving…');
    if (await save()) deleteFile(src);
  };
  tools.append(x); t.append(tools);
  // keyboard reorder
  t.onkeydown = e => {
    const d = e.key==='ArrowLeft' ? -1 : e.key==='ArrowRight' ? 1 : 0; if (!d) return;
    const j = i + d; if (j<0 || j>=p.images.length) return;
    e.preventDefault(); [p.images[i], p.images[j]] = [p.images[j], p.images[i]]; renderEditor(); renderList(); scheduleSave();
    setTimeout(()=>{ const n = $('#imgs').children[j]; n && n.focus(); }, 0);
  };
  // mouse drag reorder
  t.addEventListener('dragstart', e => { dragFrom = i; t.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); });
  t.addEventListener('dragend', () => { dragFrom = null; t.classList.remove('dragging'); document.querySelectorAll('.tile.target').forEach(n=>n.classList.remove('target')); });
  t.addEventListener('dragover', e => { if (dragFrom===null) return; e.preventDefault(); t.classList.add('target'); });
  t.addEventListener('dragleave', () => t.classList.remove('target'));
  t.addEventListener('drop', e => {
    if (dragFrom===null) return; e.preventDefault(); e.stopPropagation();
    const [m] = p.images.splice(dragFrom, 1); p.images.splice(i, 0, m); dragFrom = null;
    renderEditor(); renderList(); scheduleSave();
  });
  return t;
}

/* ---------- uploading ---------- */
const OK_TYPES = ['image/jpeg','image/png','image/webp','image/avif','image/gif'];
$('#fileInput').onchange = e => { const p = data.projects[sel]; if (p) upload(p, [...e.target.files]); e.target.value = ''; };

async function upload(p, files){
  files = files.filter(f => f.type.startsWith('image/'));
  if (!files.length){ toast('Only image files can be added'); return; }
  const grid = $('#imgs');
  let done = 0, failed = 0;
  // upload a few at a time, keeping the drop order
  const jobs = files.map(f => ({ f, t: null, src: null }));
  jobs.forEach(j => {
    j.t = el('div',{className:'tile uploading'}); j.t.append(el('img',{src: URL.createObjectURL(j.f), alt:''}));
    grid.append(j.t);
  });
  let next = 0;
  async function worker(){
    while (next < jobs.length){
      const j = jobs[next++];
      try {
        if (!OK_TYPES.includes(j.f.type)) throw new Error('Unsupported file type');
        if (j.f.size > 40*1024*1024) throw new Error('Larger than 40 MB');
        if (mode === 'online'){
          blobClient = blobClient || await import(BLOB_CLIENT);
          const name = 'works/' + (j.f.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-').replace(/^[-.]+/,'').slice(-60) || 'image.jpg');
          const fn = uploadMode === 'presigned' ? blobClient.uploadPresigned : blobClient.upload;
          const res = await fn(name, j.f, { access:'public', handleUploadUrl:'/api/upload', contentType: j.f.type, multipart: j.f.size > 8*1024*1024 });
          j.src = res.url;
        } else {
          const r = await fetch('/api/upload?name=' + encodeURIComponent(j.f.name), {method:'POST', headers:{'Content-Type': j.f.type}, body: j.f});
          const res = await r.json().catch(()=>({error:'Server not reachable'}));
          if (!r.ok) throw new Error(res.error || r.statusText);
          j.src = res.src;
        }
        done++;
        j.t.classList.remove('uploading');
      } catch(e){
        failed++; j.t.classList.remove('uploading'); j.t.classList.add('failed'); j.t.dataset.error = j.f.name + ': ' + e.message;
        if (mode === 'local' && /reach|fetch/i.test(e.message)) $('#banner').classList.add('show');
      }
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  p.images = (p.images||[]).concat(jobs.filter(j=>j.src).map(j=>j.src));
  if (done){ clearTimeout(saveTimer); setStatus('saving','Saving…'); await save(); }
  if (data.projects[sel] === p) renderEditor();
  renderList();
  toast(failed ? `${done} added, ${failed} failed` : `${done} image${done===1?'':'s'} added`);
}

// stop the browser opening a file if it's dropped outside the drop area
['dragover','drop'].forEach(ev => window.addEventListener(ev, e => { if (hasFiles(e)) e.preventDefault(); }));

load();
</script>
